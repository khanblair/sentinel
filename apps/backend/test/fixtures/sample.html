<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sentinel Fixture Page</title>
  </head>
  <body>
    <h1 id="title">Sentinel Fixture Page</h1>
    <button id="reveal" type="button">Reveal message</button>
    <p id="message" style="display: none">Hello from the fixture</p>
    <label for="agree">I agree</label>
    <input id="agree" type="checkbox" aria-label="I agree to the terms" />
    <img id="logo" src="data:," alt="Sentinel logo" />
    <script>
      document.getElementById("reveal").addEventListener("click", () => {
        document.getElementById("message").style.display = "block";
      });
    </script>
  </body>
</html>
